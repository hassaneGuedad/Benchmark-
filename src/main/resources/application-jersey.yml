spring:
  application:
    name: benchmark-rest-variant-a

  datasource:
    url: jdbc:postgresql://localhost:5432/benchmark_db
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        enable_lazy_load_no_trans: true
        jdbc:
          fetch_size: 50
          batch_size: 20
        order_inserts: true
        order_updates: true

app:
  use-join-fetch: false
  variant: "A"

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.glassfish.jersey: WARN

